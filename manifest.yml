modules:
  jira:customField:
    - key: work-orders-table-field
      name: Work Orders Table
      description: Read-only table of related Airtable Work Orders, populated from a JSON payload.
      type: string
      readOnly: false
      view:
        resource: main
        render: native
      edit:
        resource: main
        render: native
resources:
  - key: main
    path: src/frontend/index.jsx
app:
  runtime:
    name: nodejs22.x
    memoryMB: 256
    architecture: arm64
  id: ari:cloud:ecosystem::app/REPLACE-WITH-forge-register
permissions:
  scopes: []
